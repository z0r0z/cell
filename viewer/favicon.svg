<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CELL">
  <!--
    The sensor port, straight off the enclosure: the fingertip lands here and
    the cartridge reads through it. The glowing band is the bezel and the dark
    middle is the read spot, which on the real instrument is matte black so it
    returns nothing. Oxblood is the model's own accent colour.

    Drawn for 16px first. Nothing here is thinner than the bezel band, because
    nothing thinner survives at that size. The recess's index ring is not here
    for the same reason: at 16px it fell inside the bezel's own halo. The
    centre stays dark on purpose, since filling it makes a generic red dot.
  -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#26241f"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#tile)"/>

  <!-- bezel: a wide soft halo under a hard band, which is what reads as glow -->
  <circle cx="16" cy="16" r="8.4" fill="none" stroke="#e0424f" stroke-width="7" opacity="0.16"/>
  <circle cx="16" cy="16" r="8.4" fill="none" stroke="#b62a38" stroke-width="4.2"/>
  <circle cx="16" cy="16" r="8.4" fill="none" stroke="#e85561" stroke-width="1.3" opacity="0.85"/>

  <!-- read spot -->
  <circle cx="16" cy="16" r="6.3" fill="#0b0a0a"/>
</svg>
