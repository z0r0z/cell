<text x="46" y="947" font-size="10" letter-spacing="3" fill="#6F7178">THREE CHOICES THAT LOOK COSMETIC AND ARE NOT</text>
<text x="46" y="971" font-size="11" fill="#D8D2C8">Vents must be blind pockets.</text>
<text x="46" y="987" font-size="9.5" fill="#6F7178">15 slots on the front face, 3.0 deep. If any becomes a through-hole, ambient light reaches the optical chamber and the 415 nm gate fails. Print them blind and verify with the light-tightness test.</text>
<text x="46" y="1017" font-size="11" fill="#D8D2C8">The pad is reserved, not fitted.</text>
<text x="46" y="1033" font-size="9.5" fill="#6F7178">24.0 × 12.0 printed marking sizing the optional fingerprint sensor. Deliberately flat, not a pocket: an unpopulated recess on the deck collects blood. The base build leaves it blank — the PIN does identity.</text>
<text x="46" y="1063" font-size="11" fill="#D8D2C8">The dish is the reader, not a dial.</text>
<text x="46" y="1079" font-size="9.5" fill="#6F7178">The ring is a bezel, not a control. Nothing rotates. The cartridge enters through the front slot and sits under the dish.</text>
