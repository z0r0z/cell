<line x1="46" y1="929" x2="1134" y2="929" stroke="#22242A" stroke-width="1"/>
<text x="46" y="947" font-size="10" letter-spacing="3" fill="#6F7178">THREE THINGS THE MODEL DOES NOT SAY</text>
<text x="46" y="971" font-size="11" fill="#D8D2C8">Vents must be blind pockets.</text>
<text x="46" y="987" font-size="9.5" fill="#6F7178">13 slots on the front face, 3.0 deep. If any becomes a through-hole, ambient light reaches the optical chamber and the</text>
<text x="46" y="1001" font-size="9.5" fill="#6F7178">415 nm gate fails. Print them blind and verify with the light-tightness test.</text>
<text x="46" y="1015" font-size="11" fill="#D8D2C8">The pad is reserved, not fitted.</text>
<text x="46" y="1031" font-size="9.5" fill="#6F7178">23.7 × 11.7 recess for the optional fingerprint sensor. The base build leaves it blank — the PIN does identity. Print</text>
<text x="46" y="1045" font-size="9.5" fill="#6F7178">it flat if you are not fitting one.</text>
<text x="46" y="1059" font-size="11" fill="#D8D2C8">The dish is the reader, not a dial.</text>
<text x="46" y="1075" font-size="9.5" fill="#6F7178">The knurled ring is a bezel, not a control. Nothing rotates. The cartridge enters through the front slot and sits</text>
<text x="46" y="1089" font-size="9.5" fill="#6F7178">under the dish.</text>
</svg>