name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r firmware/requirements.txt
      - run: python firmware/run_tests.py

  drawings:
    # The mechanical drawing is generated from the model. If a commit changes
    # one without regenerating the other they have drifted, which is exactly
    # what BUILD.md 10 promises cannot happen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The model is tracked with Git LFS. Without this the checkout is a
          # 130-byte pointer file, the parser finds no vertices, and the job
          # fails on an empty array rather than on a real drift.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python tools/gen_mechanical.py
      - run: |
          if ! git diff --quiet diagrams/mechanical.svg; then
            echo "::error::diagrams/mechanical.svg is out of date."
            echo "Run: python tools/gen_mechanical.py"
            git diff --stat diagrams/mechanical.svg
            exit 1
          fi

  printables:
    # The STLs in models/print are what a builder actually prints. They are
    # generated from the same constants BUILD.md specifies, so a change to the
    # generator that is not regenerated leaves stale parts in the repo and
    # somebody prints yesterday's cartridge. gen_printables.py also validates
    # every mesh and the fit checks, and exits non-zero rather than hand a
    # slicer something it would have to guess at.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python tools/gen_printables.py
      - run: |
          if ! git diff --quiet models/print; then
            echo "::error::models/print is out of date."
            echo "Run: python tools/gen_printables.py"
            git diff --stat models/print
            exit 1
          fi
