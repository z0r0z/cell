name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r firmware/requirements.txt
      - run: python firmware/run_tests.py

  cross-checks:
    # The same suites, with the OPTIONAL second opinions installed.
    #
    # requirements.txt lists these as optional and every suite that uses them
    # skips when they are absent — so on the job above they all skipped, and
    # the strongest independent verification this repo has was running on
    # nobody's machine but the last person's who happened to install them.
    # What skips here is what VALIDATION.md leans on hardest:
    #
    #   coincurve          libsecp256k1 checks our BIP-341 tweak and verifies
    #                      our BIP-340 signatures — the implementation Core signs with
    #   python-bitcointx   an independent interpreter EXECUTES our scripts
    #   cryptoauthlib      Microchip's own config-zone definition and their own
    #                      CheckMac digest, against our transcription of both
    #
    # Split from the job above so a packaging break in an optional dependency
    # reddens this and not the suite a first-time cloner runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r firmware/requirements.txt
      - run: pip install coincurve python-bitcointx cryptoauthlib
      # The driver-conformance checks need the device libraries to introspect.
      # Headless OpenCV, because CI has no display.
      - run: pip install pillow qrcode gpiozero opencv-python-headless
             adafruit-circuitpython-rgb-display
      - run: python firmware/run_tests.py
      # A skip here is a check that did not run. Fail rather than pass quietly.
      - name: No cross-check may skip
        run: |
          python firmware/test_consensus.py | tee /tmp/c.log
          python firmware/test_drivers.py   | tee -a /tmp/c.log
          python firmware/test_se_atecc.py  | tee -a /tmp/c.log
          python tools/atecc_config.py selfcheck | tee -a /tmp/c.log
          if grep -q "SKIP" /tmp/c.log; then
            echo "::error::a cross-check skipped despite its library being installed"
            grep -n "SKIP" /tmp/c.log
            exit 1
          fi

  drawings:
    # The mechanical drawing is generated from the model. If a commit changes
    # one without regenerating the other they have drifted, which is exactly
    # what BUILD.md 10 promises cannot happen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The model is tracked with Git LFS. Without this the checkout is a
          # 130-byte pointer file, the parser finds no vertices, and the job
          # fails on an empty array rather than on a real drift.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python tools/gen_mechanical.py
      - run: python3 tools/gen_wiring.py
      - run: |
          if ! git diff --quiet diagrams/mechanical.svg diagrams/wiring.svg; then
            echo "::error::diagrams/mechanical.svg is out of date."
            echo "Run: python tools/gen_mechanical.py && python3 tools/gen_wiring.py"
            git diff --stat diagrams/mechanical.svg diagrams/wiring.svg
            exit 1
          fi

  printables:
    # The STLs in models/print are what a builder actually prints. They are
    # generated from the same constants BUILD.md specifies, so a change to the
    # generator that is not regenerated leaves stale parts in the repo and
    # somebody prints yesterday's cartridge. gen_printables.py also validates
    # every mesh and the fit checks, and exits non-zero rather than hand a
    # slicer something it would have to guess at.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python tools/gen_printables.py
      # A check that has never failed is a check nobody knows works. This
      # drives each geometry guard past its own limit and requires it to bite.
      - run: python tools/test_printables.py
      - run: |
          if ! git diff --quiet models/print; then
            echo "::error::models/print is out of date."
            echo "Run: python tools/gen_printables.py"
            git diff --stat models/print
            exit 1
          fi

  contracts:
    # The on-chain verifier is checked against vectors generated by
    # firmware/attest.py, which is itself checked against the published BIP-340
    # vectors. Regenerating them here means the Solidity cannot drift from the
    # device: change the record layout and this job fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: forge install foundry-rs/forge-std --no-git
        working-directory: contracts
      - run: python3 contracts/test/gen_registry_vectors.py
      - run: forge test -vv
        working-directory: contracts

  regtest:
    # End-to-end against a real Bitcoin Core on a private regtest chain: Core
    # funds an address the firmware derived, the firmware signs, Core finalises
    # and mines it. This is what caught the malformed BIP-174 proprietary key
    # that our own parser accepted, so it is worth keeping honest on every push.
    #
    # Kept out of the unit job on purpose. It downloads and runs a 40 MB binary,
    # and a Core outage should not redden the suite that has nothing to do with
    # Core.
    runs-on: ubuntu-latest
    env:
      CORE_VERSION: "28.0"
      # Pinned, not merely checked against the SHA256SUMS served alongside the
      # download. Verifying a file against a hash from the same host proves the
      # transfer was not corrupted and nothing else -- if bitcoincore.org is
      # ever compromised, both move together. This value lives in the
      # repository, so a substituted binary fails here rather than executing in
      # CI on a wallet project. Update it deliberately when bumping
      # CORE_VERSION.
      CORE_SHA256: "7fe294b02b25b51acb8e8e0a0eb5af6bbafa7cd0c5b0e5fcbb61263104a82fbc"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r firmware/requirements.txt

      - name: Cache Bitcoin Core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: ~/bitcoin-core
          key: bitcoin-core-${{ env.CORE_VERSION }}-linux-x86_64

      - name: Download and verify Bitcoin Core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TARBALL="bitcoin-${CORE_VERSION}-x86_64-linux-gnu.tar.gz"
          curl -fsSLO "https://bitcoincore.org/bin/bitcoin-core-${CORE_VERSION}/${TARBALL}"
          echo "${CORE_SHA256}  ${TARBALL}" | sha256sum -c -
          mkdir -p ~/bitcoin-core
          tar -xzf "${TARBALL}" -C ~/bitcoin-core --strip-components=1
          rm "${TARBALL}"

      - name: Run the regtest round trip
        run: python3 tools/regtest_e2e.py --bitcoin-dir ~/bitcoin-core/bin
